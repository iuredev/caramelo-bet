services:
    # ─── Database ───────────────────────────────────────────
    postgres:
        image: postgres:latest
        container_name: caramelo-postgres
        environment:
            POSTGRES_USER: caramelo
            POSTGRES_PASSWORD: caramelo123
            POSTGRES_DB: caramelo_bet
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U caramelo -d caramelo_bet"]
            interval: 10s
            timeout: 5s
            retries: 5

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: caramelo-pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: admin
        ports:
            - "5050:80"
        depends_on:
            - postgres

    # ─── Cache ──────────────────────────────────────────────
    redis:
        image: redis:7-alpine
        container_name: caramelo-redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis-insight:
        image: redis/redisinsight:latest
        container_name: caramelo-redis-insight
        ports:
            - "5540:5540"
        volumes:
            - redis_insight_data:/data
        depends_on:
            - redis

    # ─── Message Queue ───────────────────────────────────────
    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: caramelo-rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: caramelo
            RABBITMQ_DEFAULT_PASS: caramelo123
        ports:
            - "5672:5672" # AMQP
            - "15672:15672" # Management UI
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ─── Logging ─────────────────────────────────────────────
    seq:
        image: datalust/seq:latest
        container_name: caramelo-seq
        environment:
            ACCEPT_EULA: Y
            SEQ_FIRSTRUN_ADMINPASSWORD: caramelo123
        ports:
            - "5341:5341"
            - "8081:80"
        volumes:
            - seq_data:/data

    # ─── Metrics ─────────────────────────────────────────────
    prometheus:
        image: prom/prometheus:latest
        container_name: caramelo-prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus

    grafana:
        image: grafana/grafana:latest
        container_name: caramelo-grafana
        environment:
            GF_SECURITY_ADMIN_PASSWORD: caramelo123
        ports:
            - "3001:3000"
        volumes:
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus

    # ─── Tracing ─────────────────────────────────────────────
    jaeger:
        image: jaegertracing/jaeger:2.6.0
        container_name: caramelo-jaeger
        ports:
            - "16686:16686"
            - "4317:4317"
            - "4318:4318"
            - "8889:8889"
            - "8888:8888"
        volumes:
            - ./infra/jaeger/jaeger-config.yml:/etc/jaeger/config.yml
        command: ["--config", "/etc/jaeger/config.yml"]
        depends_on:
            - prometheus

    # ─── Load Balancer ───────────────────────────────────────
    nginx:
        image: nginx:alpine
        container_name: caramelo-nginx
        ports:
            - "80:80"
        volumes:
            - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - jaeger
volumes:
    postgres_data:
    redis_data:
    redis_insight_data:
    rabbitmq_data:
    seq_data:
    prometheus_data:
    grafana_data:
